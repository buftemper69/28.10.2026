<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="../home.html"><img src="../images/home.png" id="home-image"></a>
    </header>
    <main>
        <div id="first-page">
            <p> Добро пожаловать в анкету! Заполните её ниже:</p>
            <div>
                <input id="surname" placeholder="Фамилия">
                <input id="name" placeholder="Имя">
                <input id="patronymic" placeholder="Отчество">
            </div>
            <input id="input-color" type="color">
            <button id="submit-first-button">Submit</button>
        </div>

        <div id="second-page">
            <form>
                <label for="age">Age:</label>
                <input id="age" type="number">

                <label>Are you a student?</label>
                <label for="yes">Yes</label>
                <input id="Yes" type="radio">
                <label for="no">No</label>
                <input id="No" type="radio">

                <label>What're ur favourite subjects?</label>
                <label for="math">Math</label>
                <input id="math" type="checkbox">

                <label for="sport">Sport</label>
                <input id="sport" type="checkbox">

                <label for="english">English</label>
                <input id="english" type="checkbox">

                <label for="french">French</label>
                <input id="french" type="checkbox">


            </form>
            <button id="submit-second-button">Submit</button>
        </div>
        <div id="third-page">
            <p>Спасибо за ответы!</p>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
